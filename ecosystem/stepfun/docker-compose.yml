services:
  stepfun-kb:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: stepfun-mini-kb:1.0.0
    ports:
      - "8788:8788"
    environment:
      PORT: "8788"
      EMBED_DIM: "384"
      SEEKDB_DIR: "/app/data/seekdb-data"
    volumes:
      - ./data/seekdb-data:/app/data/seekdb-data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
